[package]
name = "retrocpu_asm_rs"
version = "0.1.0"
edition = "2021"
description = "Rust port baseline of retrocpu_asm_ts"
license = "UNLICENSED"

[lib]
name = "retrocpu_asm_rs"
path = "src/lib.rs"

[[bin]]
name = "retrocpu_asm"
path = "src/bin/retrocpu_asm.rs"

[[bin]]
name = "asm_snapshot"
path = "src/bin/asm_snapshot.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pest = "2.8"
pest_derive = "2.8"