[package]
name = "retrocpu_emu_rs"
version = "0.1.0"
edition = "2021"

[lib]
name = "retrocpu_emu_rs"
path = "src/lib.rs"

[[test]]
name = "integration"
path = "test/mod.rs"

[[example]]
name = "seven_segment_led"
path = "examples/seven_segment_led.rs"

[[example]]
name = "bullet_led"
path = "examples/bullet_led.rs"

[dependencies]
egui = "0.36"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
json5 = "0.4"
# WSL では wgpu+Wayland が Broken pipe になりやすいので OpenGL(glow)+X11 を使う。
eframe = { version = "0.36", default-features = false, features = [
	"glow",
	"default_fonts",
	"x11",
] }

[dev-dependencies]
# examples も同設定（dependencies と重複可）
eframe = { version = "0.36", default-features = false, features = [
	"glow",
	"default_fonts",
	"x11",
] }
